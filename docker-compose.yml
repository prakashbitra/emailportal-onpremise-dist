# ══════════════════════════════════════════════════════════════════
#  EmailPortal On-Premise — Docker Compose
#  Usage:
#    1. Copy .env.template to .env and fill in your values
#    2. docker compose up -d
#    3. Open http://YOUR-SERVER-IP (Caddy auto-provisions HTTPS if
#       PUBLIC_DOMAIN in .env is a real, DNS-pointed domain; otherwise
#       serves plain HTTP)
# ══════════════════════════════════════════════════════════════════

services:

  # ── Reverse proxy — Caddy auto-provisions HTTPS via Let's Encrypt when
  #    PUBLIC_DOMAIN points at this server; falls back to plain HTTP
  #    otherwise. Fronts both app replicas with automatic failover, so a
  #    version update (recreate one replica, wait healthy, recreate the
  #    other) never drops traffic — see Caddyfile.
  caddy:
    image: caddy:2-alpine
    container_name: ep_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: "${PUBLIC_DOMAIN:-:80}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ep_caddy_data:/data
      - ep_caddy_config:/config
    depends_on:
      - app
      - app2
    networks:
      - emailportal

  # ── Application — 2 replicas for zero-downtime updates ───────────
  app:
    image: ghcr.io/prakashbitra/emailportal-onpremise:latest
    container_name: ep_app
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ep_config:/app/config        # setup wizard writes config here
      - /var/run/docker.sock:/var/run/docker.sock  # for one-click updates
    networks:
      - emailportal

  app2:
    image: ghcr.io/prakashbitra/emailportal-onpremise:latest
    container_name: ep_app2
    restart: unless-stopped
    environment:
      ENABLE_CRON: "false"
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ep_config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - emailportal

  # ── Background Worker ────────────────────────────────────────────
  worker:
    image: ghcr.io/prakashbitra/emailportal-onpremise-worker:latest
    container_name: ep_worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - emailportal

  # ── PostgreSQL (built-in) ────────────────────────────────────────
  # Remove this section if you are using your own external database server.
  db:
    image: postgres:16-alpine
    container_name: ep_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       emailportal
      POSTGRES_USER:     emailportal
      POSTGRES_PASSWORD: CHANGE_ME     # change this + update DATABASE_URL in .env
    volumes:
      - ep_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emailportal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - emailportal

volumes:
  ep_postgres:
  ep_config:
  ep_caddy_data:
  ep_caddy_config:

networks:
  emailportal:
    driver: bridge
